# =============================================================================
#  Nginx для проекта SkillPort.
#
#  Схема: браузер → Nginx (порт 80) → Gunicorn (127.0.0.1:8000) → Django.
#  Порт 8000 наружу не публикуется: Gunicorn слушает только localhost,
#  поэтому снаружи приложение доступно исключительно через Nginx.
#
#  Файл кладётся в /etc/nginx/sites-available/skillport
#  и включается симлинком в /etc/nginx/sites-enabled/.
#
#  server_name _ означает «любой хост»: этого достаточно для доступа по IP.
#  Если появится домен — замените _ на него.
# =============================================================================

server {
    listen 80;
    listen [::]:80;

    server_name _;

    # Ограничение размера загружаемых файлов (по умолчанию в Nginx всего 1 МБ)
    client_max_body_size 10M;

    # --- Статика Django (результат collectstatic) ------------------------------
    # Nginx отдаёт файлы прямо с диска, не нагружая приложение
    location /static/ {
        alias /var/www/SkillPort_project/staticfiles/;
        access_log off;
        expires 30d;
    }

    # --- Медиафайлы, загруженные пользователями ---------------------------------
    location /media/ {
        alias /var/www/SkillPort_project/media/;
        access_log off;
        expires 7d;
    }

    # --- Всё остальное уходит в Gunicorn ---------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
